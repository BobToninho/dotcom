    <header>
      <h1 id="title" style="font-weight: normal"><a href="/">Roberto Tonino</a></h1>

    <div id="counter">
      <input readonly type="number" id="count" value="0" />

      <button id="plus-two">+2</button>
      <button id="plus-four">+4</button>
      <button id="plus-six">+6</button>

      <form id="set-value">
        <label for="initial">Value</label>
        <input id="initial" />

        <button type="submit">Set value</button>
      </form>
    </div>

    <script>
      const ITEM_KEY = 'count'

      const $count = document.getElementById('count')
      const $initial = document.getElementById('initial')

      const savedCount = localStorage.getItem(ITEM_KEY)

      function increaseCount(by) {
        const newValue = Number($count.value) + by
        $count.value = newValue
        localStorage.setItem(ITEM_KEY, newValue)
      }

      document.getElementById('plus-two').addEventListener('click', () => increaseCount(2))
      document.getElementById('plus-four').addEventListener('click', () => increaseCount(4))
      document.getElementById('plus-six').addEventListener('click', () => increaseCount(6))
      document.getElementById('set-value').addEventListener('submit', (submitEvent) => {
        submitEvent.preventDefault()


        if (isNaN(Number($initial.value))) {
          return
        }

        const value = Number($initial.value) ?? 0

        $count.value = value
        localStorage.setItem(ITEM_KEY, value)
      })


      function init() {
        if (savedCount !== null) {
          $count.value = savedCount
        }
      }

      window.addEventListener('load', () => init())
    </script>
